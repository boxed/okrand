[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "okrand"
description = "Okrand is an internationalization/translation tool for Django"
readme = "README.rst"
authors = [{ name = "Anders Hovmöller", email = "boxed@killingar.net" }]
license = { text = "BSD" }
requires-python = ">=3.8"
keywords = ["okrand"]
dependencies = ["Django>=3.2", "gitignorefile"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/boxed/okrand"

[dependency-groups]
dev = ["hammett", "pytest-django"]

[tool.hatch.version]
path = "okrand/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["okrand"]

[tool.pytest.ini_options]
testpaths = ["tests", "okrand", "docs"]
addopts = "--strict-markers -r fEsxXw --no-migrations"
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py", "helpers.py", "*__tests.py"]
markers = ["django_db"]
